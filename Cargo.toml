[workspace]
resolver = "2"
members = [
    "lmtt",
    "lmtt-core",
    "lmtt-platforms",
    "lmtt-modules", "lmtt-config-tui",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
authors = ["Mason"]
license = "MIT"
repository = "https://github.com/MasonRhodesDev/linux-multi-theme-toggle"
description = "Linux Multi-Theme Toggle - Fast async theme switching for Hyprland/Wayland"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
thiserror = "1.0"

# Config and CLI
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"

# D-Bus for XDG portal and notifications
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

# File system and utilities
dirs = "5.0"
which = "6.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Color utilities
palette = "0.7"

# Process management
nix = { version = "0.29", features = ["signal", "process"] }

# Auto-discovery for modules
inventory = "0.3"

# Template engine for custom modules
handlebars = "5.1"
tempfile = "3.10"
appearance-profiles = { git = "https://github.com/MasonRhodesDev/appearance-profiles.git", rev = "bfd6f0d66dac7a31c4f2be042466f9222a3cb165", features = ["builder"] }
hypr-paths = "0.1.0"
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "64d5d1ed079582a2014ebf23c403a3ca03ee9c64" }

# TUI framework
ratatui = "0.28"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
