name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pure-Rust workspace (zbus is a native-Rust D-Bus implementation) — no
    # extra pacman-deps needed beyond the workflow's base toolchain.
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/rust-ci.yml@d43d3b4a06664363f1a3cd1ee7ee467b0b066ec6
