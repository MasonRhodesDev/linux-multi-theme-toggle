name: Package

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/arch-package.yml@d43d3b4a06664363f1a3cd1ee7ee467b0b066ec6

  rpm:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/rpm-check.yml@d43d3b4a06664363f1a3cd1ee7ee467b0b066ec6
    with:
      spec-name: lmtt
