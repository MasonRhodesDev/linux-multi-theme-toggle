# Published appearance bundles (appearance-profiles PUBLISHED_ROOT). lmtt,
# running as the user, is the sole producer; the greeter and locker are
# pre-login read-only consumers. Sticky world-writable (like /tmp) so every
# user can create users/<name>/ while nobody can remove another's bundle.
# Without these dirs, publication fails silently on every switch and lock
# screens fall back to runtime wallpaper decode (seconds, not milliseconds).
d /var/lib/appearance-profiles 0755 root root -
d /var/lib/appearance-profiles/users 1777 root root -
